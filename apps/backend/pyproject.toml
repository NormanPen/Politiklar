[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "politiklar-backend"
version = "0.1.0"
description = "Backend services and source crawlers for Politiklar"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "httpx>=0.28,<0.29",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "selectolax>=0.3,<0.4",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
politiklar-crawl = "crawler.__main__:main"
politiklar-import-member = "crawler.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]